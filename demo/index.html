<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F172A">
<title>Openroom demo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="demo-bar" role="status">This is a demo. Nothing here is real. <a href="https://github.com/plato15/openroom" rel="noopener">Get your own</a></div>
<div id="app"><noscript><p style="padding:24px">The demo needs JavaScript. Openroom itself does not.</p></noscript></div>

<dialog class="upload-dialog" id="upload-dlg" aria-label="Upload a file">
  <form class="upload-form" id="upload-form">
    <div class="dlg-head"><h3>Upload a file</h3><button type="button" class="dlg-x" data-close aria-label="Close">&times;</button></div>
    <input type="file" name="file" aria-label="File to upload">
    <p class="small muted">Demo only: nothing is really uploaded. A sample file with this name is added to the page.</p>
    <div class="dlg-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Upload</button></div>
  </form>
</dialog>
<dialog class="drawer" id="edit-dlg" aria-label="Edit document">
  <form class="drawer-form" id="edit-form">
    <div class="drawer-head"><div><p class="small muted">Edit document</p><h3></h3></div><button type="button" class="dlg-x" data-close aria-label="Close">&times;</button></div>
    <div class="drawer-body">
      <section class="drawer-sec"><label class="toggle"><input type="checkbox" name="visible"><span class="track" aria-hidden="true"></span><span>Visible to investors<small>Only people with access to this folder can see it.</small></span></label></section>
      <section class="drawer-sec"><h4>Name</h4><input name="name" maxlength="160" aria-label="File name"></section>
    </div>
    <div class="drawer-foot"><span></span><span class="foot-right"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save changes</button></span></div>
  </form>
</dialog>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
